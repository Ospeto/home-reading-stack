# ==============================================================================
# LightHouse Reading Stack — Standby Containerized Compose
# ==============================================================================
# Designed for portable multi-host migration, containerized deployment,
# and disaster recovery. Synchronized with native macOS LaunchAgent architecture.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
# ==============================================================================

services:
  # 1. KOSync Server — Real-time KOReader Progress Synchronization
  kosync:
    image: ghcr.io/nperez0111/koreader-sync:latest
    container_name: reading-kosync
    restart: unless-stopped
    ports:
      - "${KOSYNC_PORT:-7200}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - PASSWORD_SALT=${KOSYNC_PASSWORD_SALT:-747aa604e460376f174d9e73240f9d768b06b02dfa63a0b4}
      - DISABLE_USER_REGISTRATION=false
      - LOG_LEVEL=info
      - NODE_ENV=production
    volumes:
      - ./data/kosync:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 2. Calibre Server & OPDS Feed — Book Catalog & Kindle OTA Downloads
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: reading-calibre-web
    restart: unless-stopped
    ports:
      - "${CALIBRE_PORT:-8088}:8083"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Yangon}
      - DOCKER_MODS=linuxserver/mods:universal-calibre
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
    volumes:
      - ./data/calibre-config:/config
      - ${CALIBRE_LIBRARY_DIR:-./data/calibre-library}:/books
      - ${BOOKS_DROP_DIR:-./data/books-drop}:/import
    depends_on:
      - kosync

  # 3. Reading HQ Dashboard & Ingestion Server
  reading-hq:
    image: oven/bun:1-alpine
    container_name: reading-hq
    restart: unless-stopped
    working_dir: /app
    command: ["bun", "run", "server.ts"]
    ports:
      - "${UPLOADER_PORT:-8086}:8086"
    environment:
      - PORT=8086
      - CALIBRE_SERVER_URL=http://calibre-web:8083
      - CALIBRE_LIBRARY_DIR=/books
      - CALIBRE_DB_PATH=/books/metadata.db
      - KOSYNC_DB_PATH=/data/kosync/koreader-sync.db
      - JOBS_DB_PATH=/app/data/cache.db
      - COVER_CACHE_DIR=/app/data/covers
      - BOOKS_DROP_DIR=/import
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - READING_API_KEY=${READING_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
      - JEV_API_KEY=${JEV_API_KEY:-}
      - READING_WEBAPP_URL=${READING_WEBAPP_URL:-https://reading.wavypremium.xyz}
      - KOSYNC_WAN_URL=${KOSYNC_WAN_URL:-http://kosync-sg.wavypremium.xyz}
      - NODE_ENV=production
    volumes:
      - ${UPLOADER_DIR:-./uploader}:/app
      - ./data/uploader:/app/data
      - ${CALIBRE_LIBRARY_DIR:-./data/calibre-library}:/books
      - ${BOOKS_DROP_DIR:-./data/books-drop}:/import
      - ./data/kosync:/data/kosync:ro
      - ${MANGA_DIR:-./data/manga}:/manga
    depends_on:
      - calibre-web
      - kosync

  # 4. Telegram Ingestion Bot (Optional standby worker for containerized setups)
  reading-bot:
    image: oven/bun:1-alpine
    container_name: reading-bot
    restart: unless-stopped
    profiles: ["bot"]
    working_dir: /app
    command: ["bun", "run", "bot.ts"]
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - CALIBRE_SERVER_URL=http://calibre-web:8083
      - CALIBRE_LIBRARY_DIR=/books
      - CALIBRE_DB_PATH=/books/metadata.db
      - KOSYNC_DB_PATH=/data/kosync/koreader-sync.db
      - JOBS_DB_PATH=/app/data/cache.db
      - COVER_CACHE_DIR=/app/data/covers
      - BOOKS_DROP_DIR=/import
      - NODE_ENV=production
    volumes:
      - ${UPLOADER_DIR:-./uploader}:/app
      - ./data/uploader:/app/data
      - ${CALIBRE_LIBRARY_DIR:-./data/calibre-library}:/books
      - ${BOOKS_DROP_DIR:-./data/books-drop}:/import
      - ./data/kosync:/data/kosync:ro
    depends_on:
      - reading-hq
