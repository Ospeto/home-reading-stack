<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%">
  <defs>
    <!-- Left Facet (Key-Light Platinum Gradient) -->
    <linearGradient id="markFacetKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Right Facet (Inner Shadow Titanium Gradient) -->
    <linearGradient id="markFacetFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Foot Shelf Facet (Horizontal Base Plane) -->
    <linearGradient id="markFacetShelf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Golden Focal Beacon Gradient (id="markBeacon" required by tests) -->
    <radialGradient id="markBeacon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="rgba(217, 119, 6, 0)" />
    </radialGradient>

    <!-- Cinematic Focused Primary Beam (id="markRightBeam" required by tests) -->
    <linearGradient id="markRightBeam" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="rgba(255, 247, 214, 0.70)" />
      <stop offset="20%" stop-color="rgba(251, 191, 36, 0.30)" />
      <stop offset="55%" stop-color="rgba(245, 158, 11, 0.08)" />
      <stop offset="90%" stop-color="rgba(245, 158, 11, 0.01)" />
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)" />
    </linearGradient>

    <!-- Atmospheric Secondary Beam (id="markLeftBeam" required by tests) -->
    <linearGradient id="markLeftBeam" x1="100%" y1="15%" x2="0%" y2="85%">
      <stop offset="0%" stop-color="rgba(255, 247, 214, 0.45)" />
      <stop offset="30%" stop-color="rgba(125, 211, 252, 0.14)" />
      <stop offset="80%" stop-color="rgba(56, 189, 248, 0.02)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>

    <!-- Ambient Beacon Aura -->
    <radialGradient id="markAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.45)" />
      <stop offset="35%" stop-color="rgba(251, 191, 36, 0.18)" />
      <stop offset="70%" stop-color="rgba(245, 158, 11, 0.03)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <!-- Specular Micro-Ridge Stroke -->
    <linearGradient id="markRidgeSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.55)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.20)" />
    </linearGradient>

    <!-- Shelf Gold Accent Line -->
    <linearGradient id="markShelfAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.85)" />
      <stop offset="45%" stop-color="rgba(251, 191, 36, 0.35)" />
      <stop offset="100%" stop-color="rgba(251, 191, 36, 0.0)" />
    </linearGradient>

    <!-- Filters (id="markGlow" preserved for test / template compatibility) -->
    <filter id="markGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="markBeamSpread" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="markAmbientSpread" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
    <filter id="markDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- 1. Volumetric Light Rays (Lighthouse Searchlight) -->
  <!-- Beacon Apex at (102, 70) -->
  <circle cx="102" cy="70" r="110" fill="url(#markAura)" filter="url(#markAmbientSpread)" />

  <!-- Right Primary Beam (Sweeping across upper-right field) -->
  <polygon points="102,70 315,40 315,160 108,76" fill="url(#markRightBeam)" filter="url(#markBeamSpread)" />
  <!-- Left Atmospheric Secondary Beam -->
  <polygon points="102,70 5,100 5,170 96,76" fill="url(#markLeftBeam)" filter="url(#markBeamSpread)" />

  <!-- 2. Ground Contact Shadow -->
  <ellipse cx="159" cy="326" rx="105" ry="12" fill="rgba(0, 0, 0, 0.5)" filter="url(#markBeamSpread)" />

  <!-- 3. Sculpted Monogram 'L' (Architectural 3D Chiseled Geometry) -->
  <!-- Stem: X=74..130 (width 56), Ridge at X=102 -->
  <!-- Foot: Y=254..310 (height 56), Length: X=74..244 (width 170) -->
  <!-- Bounding box: [74, 244] x [70, 310] -> Center is (159, 190) in 320x380! -->
  <g filter="url(#markDropShadow)">
    <!-- Left / Outer Facet (Vertical Stem Column) -->
    <path d="
      M 84,70
      L 102,70
      L 102,282
      L 74,310
      L 74,80
      A 10,10 0 0 1 84,70
      Z
    " fill="url(#markFacetKey)" />

    <!-- Right / Inner Bevel Facet (Vertical Stem Depth Plane) -->
    <path d="
      M 102,70
      L 120,70
      A 10,10 0 0 1 130,80
      L 130,254
      L 102,282
      Z
    " fill="url(#markFacetFill)" />

    <!-- Horizontal Foot Base Facet (Grounded Foundation) -->
    <path d="
      M 74,310
      L 102,282
      L 130,254
      L 234,254
      A 10,10 0 0 1 244,264
      L 244,300
      A 10,10 0 0 1 234,310
      Z
    " fill="url(#markFacetShelf)" />

    <!-- Architectural Ridge Lines (Crisp 3D Bevels) -->
    <line x1="102" y1="70" x2="102" y2="282" stroke="url(#markRidgeSpecular)" stroke-width="1.25" />
    <line x1="74" y1="310" x2="102" y2="282" stroke="url(#markRidgeSpecular)" stroke-width="1.25" />
    <line x1="102" y1="282" x2="130" y2="254" stroke="url(#markRidgeSpecular)" stroke-width="1.25" />

    <!-- Outer Specular Edge Contour -->
    <path d="
      M 74,310
      L 74,80
      A 10,10 0 0 1 84,70
      L 120,70
      A 10,10 0 0 1 130,80
      L 130,254
      L 234,254
      A 10,10 0 0 1 244,264
    " fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.1" stroke-linecap="round" />

    <!-- Architectural Lantern Gallery Deck Line at Apex -->
    <line x1="80" y1="70" x2="124" y2="70" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" />

    <!-- Warm Amber Caustic Reflection Line along Shelf Base -->
    <line x1="130" y1="254" x2="234" y2="254" stroke="url(#markShelfAccent)" stroke-width="1.75" stroke-linecap="round" />

    <!-- Corner Focal Prism Jewel -->
    <circle cx="102" cy="282" r="3" fill="#f59e0b" opacity="0.9" filter="url(#markGlow)" />
    <circle cx="102" cy="282" r="1.2" fill="#ffffff" />
  </g>

  <!-- 4. Luminous Focal Beacon Jewel at Crown Apex (102, 70) -->
  <circle cx="102" cy="70" r="12" fill="url(#markBeacon)" filter="url(#markGlow)" />
  <circle cx="102" cy="70" r="4.5" fill="#ffffff" />
  <circle cx="102" cy="70" r="1.8" fill="#fffbeb" />
</svg>