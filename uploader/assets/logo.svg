<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Squircle Clip for Zero Edge Bleed -->
    <clipPath id="squircleClip">
      <rect x="16" y="16" width="480" height="480" rx="108" />
    </clipPath>

    <!-- Apple Midnight Obsidian Background (Deep Space Radial) -->
    <radialGradient id="bgGlow" cx="46%" cy="24%" r="76%">
      <stop offset="0%" stop-color="#161928" />
      <stop offset="42%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Frosted Glass Rim Highlight -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.36)" />
      <stop offset="18%" stop-color="rgba(255, 255, 255, 0.09)" />
      <stop offset="60%" stop-color="rgba(255, 255, 255, 0.01)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.0)" />
    </linearGradient>

    <!-- Left Facet (Key-Light Platinum Gradient) -->
    <linearGradient id="facetKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Right Facet (Inner Shadow Titanium Gradient) -->
    <linearGradient id="facetFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Foot Shelf Facet (Horizontal Base Plane) -->
    <linearGradient id="facetShelf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Golden Focal Beacon Gradient -->
    <radialGradient id="markBeacon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="rgba(217, 119, 6, 0)" />
    </radialGradient>

    <!-- Cinematic Focused Primary Beam (Right Quadrant) -->
    <linearGradient id="markRightBeam" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="rgba(255, 247, 214, 0.65)" />
      <stop offset="20%" stop-color="rgba(251, 191, 36, 0.28)" />
      <stop offset="55%" stop-color="rgba(245, 158, 11, 0.08)" />
      <stop offset="90%" stop-color="rgba(245, 158, 11, 0.01)" />
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)" />
    </linearGradient>

    <!-- Atmospheric Secondary Beam (Left Quadrant) -->
    <linearGradient id="markLeftBeam" x1="100%" y1="15%" x2="0%" y2="85%">
      <stop offset="0%" stop-color="rgba(255, 247, 214, 0.40)" />
      <stop offset="30%" stop-color="rgba(125, 211, 252, 0.12)" />
      <stop offset="80%" stop-color="rgba(56, 189, 248, 0.02)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>

    <!-- Ambient Beacon Aura -->
    <radialGradient id="beaconAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.45)" />
      <stop offset="35%" stop-color="rgba(251, 191, 36, 0.18)" />
      <stop offset="70%" stop-color="rgba(245, 158, 11, 0.03)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <!-- Specular Micro-Ridge Stroke -->
    <linearGradient id="ridgeSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.55)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.20)" />
    </linearGradient>

    <!-- Shelf Gold Accent Line -->
    <linearGradient id="shelfAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.85)" />
      <stop offset="45%" stop-color="rgba(251, 191, 36, 0.35)" />
      <stop offset="100%" stop-color="rgba(251, 191, 36, 0.0)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="beamSpread" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="ambientSpread" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="monogramDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.72" />
    </filter>
  </defs>

  <!-- 1. Squircle Canvas (Clipped for Zero Bleed) -->
  <g clip-path="url(#squircleClip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#bgGlow)" />

    <!-- 2. Cinematic Volumetric Light Rays (Lighthouse Searchlight) -->
    <!-- Beacon Apex at (204, 116) -->
    <circle cx="204" cy="116" r="140" fill="url(#beaconAura)" filter="url(#ambientSpread)" />

    <!-- Right Primary Beam (Sweeping across upper-right sky) -->
    <polygon points="204,116 496,75 496,220 210,124" fill="url(#markRightBeam)" filter="url(#beamSpread)" />
    <!-- Left Atmospheric Secondary Beam -->
    <polygon points="204,116 16,160 16,240 198,124" fill="url(#markLeftBeam)" filter="url(#beamSpread)" />

    <!-- 3. Ground Contact Ambient Shadow -->
    <ellipse cx="268" cy="408" rx="128" ry="14" fill="rgba(0, 0, 0, 0.68)" filter="url(#beamSpread)" />

    <!-- 4. Sculpted Monogram 'L' (Architectural 3D Chiseled Geometry) -->
    <g filter="url(#monogramDepth)">
      <!-- Left / Outer Facet (Vertical Stem Column) -->
      <path d="
        M 184,116
        L 204,116
        L 204,356
        L 172,388
        L 172,128
        A 12,12 0 0 1 184,116
        Z
      " fill="url(#facetKey)" />

      <!-- Right / Inner Bevel Facet (Vertical Stem Depth Plane) -->
      <path d="
        M 204,116
        L 224,116
        A 12,12 0 0 1 236,128
        L 236,324
        L 204,356
        Z
      " fill="url(#facetFill)" />

      <!-- Horizontal Foot Base Facet (Grounded Architectural Foundation) -->
      <path d="
        M 172,388
        L 204,356
        L 236,324
        L 352,324
        A 12,12 0 0 1 364,336
        L 364,376
        A 12,12 0 0 1 352,388
        Z
      " fill="url(#facetShelf)" />

      <!-- Architectural Ridge Lines (Crisp 3D Bevels) -->
      <line x1="204" y1="116" x2="204" y2="356" stroke="url(#ridgeSpecular)" stroke-width="1.5" />
      <line x1="172" y1="388" x2="204" y2="356" stroke="url(#ridgeSpecular)" stroke-width="1.5" />
      <line x1="204" y1="356" x2="236" y2="324" stroke="url(#ridgeSpecular)" stroke-width="1.5" />

      <!-- Outer Specular Edge Contour (Apple Hardware Micro-Chamfer) -->
      <path d="
        M 172,388
        L 172,128
        A 12,12 0 0 1 184,116
        L 224,116
        A 12,12 0 0 1 236,128
        L 236,324
        L 352,324
        A 12,12 0 0 1 364,336
      " fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.25" stroke-linecap="round" />

      <!-- Architectural Lantern Gallery Deck Line at Apex -->
      <line x1="180" y1="116" x2="228" y2="116" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />

      <!-- Warm Amber Caustic Reflection Line along Shelf Base -->
      <line x1="236" y1="324" x2="352" y2="324" stroke="url(#shelfAccent)" stroke-width="2" stroke-linecap="round" />

      <!-- Corner Focal Prism Jewel (At the heart of the 45-degree junction) -->
      <circle cx="204" cy="356" r="3.5" fill="#f59e0b" opacity="0.9" filter="url(#softGlow)" />
      <circle cx="204" cy="356" r="1.5" fill="#ffffff" />
    </g>

    <!-- 5. Luminous Focal Beacon Jewel at Crown Apex (204, 116) -->
    <circle cx="204" cy="116" r="14" fill="url(#markBeacon)" filter="url(#softGlow)" />
    <circle cx="204" cy="116" r="5" fill="#ffffff" />
    <circle cx="204" cy="116" r="2" fill="#fffbeb" />
  </g>

  <!-- Squircle Border & Frosted Rim -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#252a3b" stroke-width="1.5" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#rimLight)" stroke-width="2" />
</svg>