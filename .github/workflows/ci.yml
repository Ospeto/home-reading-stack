name: CI

on:
  push:
    branches: [main, "fm/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Test Suite
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run tests
        run: bun test
