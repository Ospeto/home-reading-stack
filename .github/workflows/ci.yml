name: CI

on:
  push:
    branches:
      - main
      - "fm/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Run Tests
        run: bun test
